<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>World Map — Test2</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <h1>World map — select a country</h1>
    <div id="map"></div>
    <div id="info">Click a country to select it.</div>

    <!-- Toolbar that appears when mouse is near bottom -->
    <div id="toolbar" class="toolbar-hidden">
      <div class="toolbar-inner">
        <label><input type="checkbox" id="toggle-labels" /> Add country labels</label>
        <label><input type="checkbox" id="toggle-flags" /> Add country flags</label>
        <label><input type="checkbox" id="toggle-flagmap" /> Enable flag map</label>
        <div class="spacer"></div>
        <div class="hint">Hover near bottom to show toolbar</div>
      </div>
    </div>

  </div>

  <!-- D3 for drawing and topo/geo utilities -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
